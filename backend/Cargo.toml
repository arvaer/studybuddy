[workspace]
members = ["crates/domain", "crates/app", "crates/infra", "crates/operator"]

[package]
name = "lugia"
version = "0.1.0"
edition = "2021"

[dependencies]
domain = { path = "./crates/domain" }
app = { path = "./crates/app" }
infra = { path = "./crates/infra" }
operator = { path = "./crates/operator" }
capsule-corp = { workspace = true }
capsule-host = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
http = "1"
time = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.dependencies]
# Web
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-signed"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Validation
validator = { version = "0.19", features = ["derive"] }

# HTTP client (LLM proxy)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# PDF text extraction
pdf-extract = "0.10"

# Capsule Core (docs/capsule-integration.md, "Revisit after Phase 1"): one pin,
# the probe's. capsule-host's `postgres` feature is PgStorage (H4).
capsule-corp = { git = "https://github.com/Prominent-Systems/capsule-corp", rev = "4b77dcce4de6efd8d81b0c671a33851ce353918a" }
capsule-host = { git = "https://github.com/Prominent-Systems/capsule-corp", rev = "4b77dcce4de6efd8d81b0c671a33851ce353918a", features = ["postgres"] }
